<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qala · v2</title>
<meta name="theme-color" content="#0F6E8C">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F6;--surf:#fff;--ink:#1A2730;--mut:#5E6B74;--line:#D5DCE0;--pri:#0F6E8C;--onpri:#fff;--gold:#E9B824;--teal:#2F855A;--land:#E9EEF0;--f:"Golos Text",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11191E;--surf:#19242B;--ink:#E6ECEF;--mut:#9AA8B0;--line:#2B3A43;--pri:#4FB3D1;--onpri:#0B1418;--teal:#48BB78;--land:#223039}}
:root[data-theme="dark"]{--bg:#11191E;--surf:#19242B;--ink:#E6ECEF;--mut:#9AA8B0;--line:#2B3A43;--pri:#4FB3D1;--onpri:#0B1418;--teal:#48BB78;--land:#223039}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f);display:grid;grid-template-rows:auto minmax(0,1fr)}
button,input,select{font-family:var(--f)}
button{font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
nav{display:flex;align-items:stretch;gap:2px;background:var(--surf);border-bottom:1px solid var(--line);padding:0 clamp(12px,2vw,28px);overflow-x:auto;z-index:5}
.logo{font-weight:700;font-size:20px;display:flex;align-items:baseline;gap:8px;padding:12px 24px 12px 0;white-space:nowrap}
.logo small{font-weight:400;font-size:13px;color:var(--mut)}
.tab{padding:14px 12px 11px;font-weight:500;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--pri)}
main{position:relative;isolation:isolate;min-width:0;min-height:0;overflow:hidden}
#lm{position:absolute;inset:0;background:var(--land)}
#ui{position:absolute;inset:0;z-index:1000;pointer-events:none}
.page,.panel,.top>*{pointer-events:auto}
.page{height:100%;overflow:auto;padding:24px clamp(14px,3vw,40px) 40px}
h1{font-size:26px;line-height:1.2;font-weight:700}
h2{font-size:17px;font-weight:700}
.mut{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:0}
.chip{padding:6px 12px;border:1px solid var(--line);background:var(--surf);border-radius:4px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--surf);border-color:var(--ink)}
.btn{padding:9px 16px;border-radius:5px;background:var(--pri);color:var(--onpri);font-weight:600;white-space:nowrap;flex:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.gold{background:var(--gold);color:#1A2730}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:4px}
.btn[disabled]{opacity:.4;cursor:default}
.btn.add{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 20px}
.btn.add.sm{min-height:34px;padding:0 12px}
.btn.add svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.card{background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:16px}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;max-width:660px;z-index:1000}
.search{flex:1 1 220px;padding:9px 12px;border-radius:5px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:15px}
.panel{position:absolute;top:14px;right:14px;bottom:14px;width:370px;max-width:calc(100% - 28px);background:var(--surf);border:1px solid var(--line);border-radius:8px;overflow:auto;box-shadow:0 4px 18px rgba(10,25,35,.2);z-index:1000}
.art{padding:9px 48px 9px 18px;color:#fff;font-weight:600;font-size:13px}
.pb{padding:18px;display:grid;gap:12px}
.x{position:absolute;top:5px;right:8px;width:32px;height:32px;font-size:22px;color:#fff;z-index:2}
.tag{padding:2px 9px;border-radius:3px;background:var(--land);font-size:13px}
.quote{border-left:3px solid var(--gold);padding-left:12px;color:var(--mut)}
.days{display:flex;gap:6px;margin:16px 0 12px;overflow:auto}
.day{min-width:58px;padding:7px 0;border:1px solid var(--line);background:var(--surf);border-radius:4px;display:grid;justify-items:center;color:var(--mut);font-size:13px}
.day b{font-size:19px;color:var(--ink);font-weight:700;line-height:1.2}
.day.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}.day.on b{color:var(--onpri)}
.list{display:grid;margin-top:16px;max-width:760px;background:var(--surf);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.list:not(:has(*)){display:none}
.list.tks{background:none;border:0;gap:12px;overflow:visible}
.ev{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .t{font-weight:700;font-size:17px}
.ev.fr{grid-template-columns:40px 1fr auto}
.ev.ef{grid-template-columns:72px 1fr auto}
.sq{width:40px;height:40px;border-radius:5px}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;margin-top:16px;align-items:start}
.stats{display:flex;gap:24px;margin-top:6px}.stats b{font-size:22px;display:block;line-height:1.2}
.tl{display:grid;gap:8px;margin-top:14px}
.it{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surf);border:1px solid var(--line);border-radius:6px}
.it.done{border-color:var(--teal)}
.gap{font-size:12px;color:var(--mut);padding-left:66px}
.sel{padding:8px 10px;border-radius:4px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:14px}
input[type=range]{width:100%;accent-color:var(--pri)}
.fld{display:grid;gap:5px;font-weight:500;font-size:13px;color:var(--mut)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.bd{padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--surf);display:grid;gap:2px;font-size:14px}
.bd.lock{opacity:.6}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--gold)}
.ava{width:68px;height:68px;border-radius:50%;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font-size:24px;font-weight:700}
#ob{position:fixed;inset:0;background:var(--bg);z-index:20;display:grid;place-items:center;padding:20px;overflow:auto}
#au{position:fixed;inset:0;background:var(--bg);z-index:22;display:none;place-items:center;padding:20px;overflow:auto}
.obc{max-width:500px;width:100%;display:grid;gap:18px}
.obc .search{width:100%;flex:none}
.obc .logo{padding:0;font-size:26px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg .chip{padding:14px;text-align:center;font-size:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:5px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.leaflet-container{font:inherit}
.mk{width:26px;height:26px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);position:relative;transition:transform .12s}
.mk.on{transform:scale(1.35);border-color:#1A2730}.mk.evonly{background:var(--gold);border-radius:4px}.mk.dim{opacity:.2}
.mk .ev{position:absolute;top:-10px;right:-11px;background:var(--gold);color:#1A2730;font:700 11px var(--f);min-width:18px;height:18px;border-radius:4px;display:grid;place-items:center;padding:0 4px;border:0}
.me-dot{width:20px;height:20px;border-radius:50%;background:#2A7BFF;border:3px solid #fff;animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(42,123,255,.55)}100%{box-shadow:0 0 0 22px rgba(42,123,255,0)}}
#away:empty{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.fm{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;border:3px solid #fff;display:grid;place-items:center;font:700 13px var(--f);box-shadow:0 1px 5px rgba(0,0,0,.4)}
.leaflet-tooltip.fl{background:var(--surf);color:var(--ink);border:1px solid var(--line);font:600 13px var(--f);padding:1px 8px;border-radius:4px;box-shadow:none}
.leaflet-tooltip-right.fl:before{display:none}
.addf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;margin-top:14px}
.myid{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;max-width:760px}
.myid b{font-size:26px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.perr{color:#C0392B;font-size:13px;min-height:18px;margin-top:6px}
.addf>*{min-width:0}.addf .search,.addf .sel{width:100%;height:42px;flex:none}
.mm{height:300px;border-radius:6px;margin-top:14px;overflow:hidden;isolation:isolate;border:1px solid var(--line)}
.nm{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1A2730;font:700 14px var(--f);display:grid;place-items:center;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.tk{display:grid;grid-template-columns:88px 1fr 132px;background:var(--surf);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tkm{background:var(--pri);color:var(--onpri);display:grid;align-content:center;justify-items:center;padding:14px 6px;text-align:center}
.tkt{font-weight:700;font-size:19px;margin-top:6px}
.tkb{padding:14px 16px;display:grid;gap:3px;align-content:center}
.tkq{border-left:2px dashed var(--line);padding:12px;display:grid;justify-items:center;align-content:center;gap:6px}
.tkq svg{width:96px;height:96px}
.tkq small{font-weight:600;font-size:12px;color:var(--mut);letter-spacing:.04em}
#md{display:none;position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:25;place-items:center;padding:16px;overflow:auto}
.btn.danger{background:#B3402E;color:#fff}
.mc .search{width:100%;flex:none}
.mc{background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:22px;max-width:420px;width:100%;display:grid;gap:14px}
@media (max-width:820px){
 .grid2{grid-template-columns:1fr}
 .panel{top:auto;left:10px;right:10px;bottom:10px;width:auto;max-width:none;max-height:62%}
 .top{top:10px;left:10px;right:10px}
 .addf{grid-template-columns:1fr}.addf .btn.add{width:100%}
 .ev{grid-template-columns:64px 1fr}.ev>.row:last-child{grid-column:1/-1}
 .ev.fr{grid-template-columns:40px 1fr}.ev.fr>:last-child{grid-column:1/-1}.ev.fr>.btn:last-child{justify-self:start}
 .ev.ef{grid-template-columns:64px 1fr}
 .tk{grid-template-columns:76px 1fr}.tkq{grid-column:1/-1;border-left:0;border-top:2px dashed var(--line);grid-template-columns:auto auto;justify-content:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.citysel{margin-left:auto;display:flex;align-items:center;gap:8px;padding-left:16px;font-size:13px;color:var(--mut);white-space:nowrap}
.citysel .sel{font-size:14px;font-weight:600}
.cityh{margin-top:22px}.cityh+.list{margin-top:8px}
.cm{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--surf);border:2px solid var(--surf);border-radius:5px;padding:3px 8px;font-size:13px;white-space:nowrap;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.cm span{background:var(--gold);color:#1A2730;border-radius:3px;padding:0 5px;font-size:12px;font-weight:700}
.cm.on{outline:3px solid var(--gold)}

/* ===== Qala: визуальное обновление ===== */
:root{--r:12px;--sh:0 6px 24px rgba(15,40,55,.10);--grad:linear-gradient(135deg,#0F6E8C,#2BA3B8 60%,#E9B824)}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(43,163,184,.15),transparent 60%),radial-gradient(700px 400px at -5% 110%,rgba(233,184,36,.10),transparent 60%),var(--bg)}
nav{position:relative;background:color-mix(in srgb,var(--surf) 86%,transparent);backdrop-filter:blur(12px);box-shadow:0 6px 20px rgba(10,30,40,.06)}
.logo{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:23px;letter-spacing:.3px}
.logo small{-webkit-text-fill-color:var(--mut)}
.tab{position:relative;border-bottom:0;transition:color .2s}
.tab.on{border-bottom:0}
.tab::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--pri);transform:scaleX(0);transition:transform .3s cubic-bezier(.3,.9,.3,1)}
.tab.on::after{transform:scaleX(1)}
h1{letter-spacing:-.3px}
.card,.list,.bd,.it,.tk,.mc{border-radius:var(--r)}
.panel{border-radius:16px;backdrop-filter:blur(8px);animation:slideIn .4s cubic-bezier(.2,.9,.3,1)}
.card,.bd,.it,.tk{box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.card:hover,.bd:not(.lock):hover,.it:hover,.tk:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(15,40,55,.16)}
.btn{border-radius:9px;transition:transform .15s,filter .2s,box-shadow .2s}
.btn:not(.ghost):not(.gold):not(.danger){background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 65%,#6FE0CF))}
.btn:hover:not([disabled]){filter:brightness(1.08);transform:translateY(-1px)}
.btn:active:not([disabled]){transform:scale(.95)}
.btn.gold{background:linear-gradient(135deg,#F2C94C,#E9B824);box-shadow:0 4px 14px rgba(233,184,36,.35)}
.chip{border-radius:999px;transition:all .18s}
.chip:hover{transform:translateY(-1px);border-color:var(--pri)}
.chip.on{box-shadow:0 4px 12px rgba(10,30,40,.25)}
.search,.sel{border-radius:10px;transition:border-color .2s,box-shadow .2s}
.search:focus,.sel:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
.day{border-radius:12px;transition:all .2s}
.day:hover{transform:translateY(-2px)}
.day.on{box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 45%,transparent)}
.list .ev{transition:background .2s}
.list .ev:hover{background:color-mix(in srgb,var(--pri) 7%,var(--surf))}
.ava{background:var(--grad);box-shadow:0 8px 24px rgba(15,110,140,.35)}
.tkm{background:var(--grad)}
.bar i{background:linear-gradient(90deg,var(--gold),#F2C94C);transition:width .8s}
.mk:hover{transform:scale(1.2)}
.mc{animation:pop .3s cubic-bezier(.2,1.2,.3,1)}
.tag{border-radius:999px}
.anim .page>*,.anim .list>*{animation:rise .5s both cubic-bezier(.2,.8,.3,1)}
.anim .page>:nth-child(2){animation-delay:0.05s}.anim .list>:nth-child(2){animation-delay:0.18s}.anim .page>:nth-child(3){animation-delay:0.10s}.anim .list>:nth-child(3){animation-delay:0.22s}.anim .page>:nth-child(4){animation-delay:0.15s}.anim .list>:nth-child(4){animation-delay:0.26s}.anim .page>:nth-child(5){animation-delay:0.20s}.anim .list>:nth-child(5){animation-delay:0.30s}.anim .page>:nth-child(6){animation-delay:0.25s}.anim .list>:nth-child(6){animation-delay:0.34s}.anim .page>:nth-child(7){animation-delay:0.30s}.anim .list>:nth-child(7){animation-delay:0.38s}.anim .page>:nth-child(8){animation-delay:0.35s}.anim .list>:nth-child(8){animation-delay:0.42s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(8px)}}
@keyframes flow{50%{background-position:100% 50%}}
.fact{display:grid;gap:8px;margin-top:16px;max-width:760px;padding:18px 20px;border-radius:16px;color:#fff;background:var(--grad);background-size:200% 200%;animation:flow 10s ease infinite;box-shadow:0 12px 30px rgba(15,110,140,.28);position:relative;overflow:hidden}
.fact::after{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.15)}
.fact small{opacity:.9;font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:11px}
.fact b{font-size:18px;line-height:1.35;font-weight:600;max-width:560px;position:relative;z-index:1}
.fact .row{position:relative;z-index:1;margin-top:4px}
.fact .cnt{font-weight:700;font-size:22px}
.cf{position:fixed;left:50%;bottom:22%;width:9px;height:14px;z-index:40;border-radius:2px;pointer-events:none;animation:cf 1.4s cubic-bezier(.1,.7,.4,1) forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--rt));opacity:0}}

/* ===== переключатель темы ===== */
.tt{position:relative;flex:none;align-self:center;margin-left:12px;width:58px;height:30px;border-radius:999px;background:linear-gradient(135deg,#7CC8E8,#F2D36B);border:1px solid var(--line);transition:background .5s;overflow:hidden}
.tt i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .55s cubic-bezier(.5,1.5,.4,.9);display:grid;place-items:center;color:#E9A800}
.tt svg{position:absolute;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s,transform .55s}
.tt .mo{opacity:0;transform:rotate(-90deg) scale(.5)}
:root[data-theme="dark"] .tt{background:linear-gradient(135deg,#1E2C5A,#3B2F6B)}
:root[data-theme="dark"] .tt i{transform:translateX(28px);color:#4B5BD6}
:root[data-theme="dark"] .tt .su{opacity:0;transform:rotate(90deg) scale(.5)}
:root[data-theme="dark"] .tt .mo{opacity:1;transform:none}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]) .tt{background:linear-gradient(135deg,#1E2C5A,#3B2F6B)}
:root:not([data-theme="light"]) .tt i{transform:translateX(28px);color:#4B5BD6}
:root:not([data-theme="light"]) .tt .su{opacity:0;transform:rotate(90deg) scale(.5)}
:root:not([data-theme="light"]) .tt .mo{opacity:1;transform:none}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
.tfade,.tfade *,.tfade *::before,.tfade *::after{transition:background-color .6s,color .6s,border-color .6s,box-shadow .6s!important}
/* ===== кнопки карты ===== */
.mctl{display:grid;gap:8px;justify-items:center;margin-bottom:8px!important;border:0!important;background:none!important;box-shadow:none!important}
.mb{width:46px;height:46px;border-radius:50%;background:var(--surf);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px rgba(10,30,40,.25);display:grid;place-items:center;transition:transform .15s,background .25s,color .25s}
.mb.s{width:36px;height:36px}
.mb:hover{transform:scale(1.07)}.mb:active{transform:scale(.93)}
.mb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mb.s svg{width:18px;height:18px}
.mb.on{background:#2A7BFF;color:#fff;border-color:#2A7BFF}
#cmp svg{transition:transform .15s linear}
/* ===== награды ===== */
.seg2{display:inline-flex;padding:4px;gap:4px;background:var(--land);border-radius:999px;margin-bottom:18px}
.seg2 button{padding:8px 20px;border-radius:999px;font-weight:600;color:var(--mut);transition:all .25s}
.seg2 button.on{background:var(--surf);color:var(--ink);box-shadow:0 3px 10px rgba(10,30,40,.15)}
.awsum{display:grid;gap:8px;padding:20px;border-radius:16px;color:#fff;background:var(--grad);background-size:200% 200%;animation:flow 10s ease infinite;box-shadow:0 12px 30px rgba(15,110,140,.28)}

const km=(a,b)=>{const r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))};
/* Маршруты по улицам: пешеходный OSRM на данных OpenStreetMap (routing.openstreetmap.de).
   Если сервис не ответил, на карте остаётся пунктир по прямой, а расстояние считается приблизительно. */
const ROAD='https://routing.openstreetmap.de/routed-foot/route/v1/foot/';
const RC={},RQ={},RF={},LG={},GK={};
const lk=(a,b)=>`${a.lat.toFixed(5)},${a.lng.toFixed(5)}|${b.lat.toFixed(5)},${b.lng.toFixed(5)}`;
const same=(a,b)=>a.lat==b.lat&&a.lng==b.lng;
const legD=(a,b)=>{const g=LG[lk(a,b)];return g?g.d:km(a,b)};
const route=its=>its.reduce((s,it,n)=>n?s+legD(ven(its[n-1]),ven(it)):0,0);
function gapText(a,b){const d=km(a,b);if(d>60)return`другой город, ≈ ${Math.round(d)} км`;const g=LG[lk(a,b)];
return g?`${g.d.toFixed(1)} км · ${Math.max(1,Math.round(g.t))} мин пешком`:`≈ ${d.toFixed(1)} км · ${Math.max(3,Math.round(d*12))} мин в пути`}
function refreshGaps(){document.querySelectorAll('.gap[data-k]').forEach(g=>{const p=GK[g.dataset.k];if(p)g.textContent=gapText(p[0],p[1])})}
/* делим остановки на отрезки внутри одного города и строим для каждого путь по улицам */
function runsOf(l){const vs=l.map(ven),runs=[];let cur=[];vs.forEach((v,i)=>{if(i&&km(vs[i-1],v)>40){if(cur.length)runs.push(cur);cur=[]}
if(!cur.length||!same(cur[cur.length-1],v))cur.push(v)});if(cur.length)runs.push(cur);return runs.filter(r=>r.length>1)}
function roadRun(wp){const key=wp.map(v=>v.lng.toFixed(5)+','+v.lat.toFixed(5)).join(';');
if(RC[key])return Promise.resolve(RC[key]);if(RQ[key])return RQ[key];if(RF[key]&&Date.now()-RF[key]<60000)return Promise.resolve(null);
RQ[key]=(async()=>{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),9000);
try{const r=await fetch(ROAD+key+'?overview=full&geometries=geojson&steps=false',{signal:ctl.signal});if(!r.ok)throw new Error('http');
const j=await r.json();if(j.code!=='Ok'||!j.routes||!j.routes[0]||!j.routes[0].geometry)throw new Error('no route');const rt=j.routes[0];
rt.legs.forEach((l,i)=>{if(wp[i+1])LG[lk(wp[i],wp[i+1])]={d:l.distance/1000,t:l.duration/60}});
return RC[key]={pts:rt.geometry.coordinates.map(c=>[c[1],c[0]])}}
catch(e){RF[key]=Date.now();return null}finally{clearTimeout(tm);delete RQ[key]}})();return RQ[key]}

/* planner */
function build(){const{s,e,b,ints,ex,j}=P,dt=S.date,jit=()=>Math.random()*j;
